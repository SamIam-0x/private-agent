# Digest on main is a placeholder. The release workflow rewrites it on the tag.
# https://docs.tinfoil.sh/containers/building-images

cvm-version: "0.14.12"
cpus: 2
memory: 4096

networks:
  public:
    egress: open

containers:
  - name: agent
    image: "ghcr.io/samiam-0x/private-agent@sha256:7b80dad856fb82a381cb6b443319a225b4b9b4d9dc2d4e0e788fa3c1cb23e767" # v0.0.2
    networks: [public]
    env:
      - MODEL: "kimi-k3"
      - PORT: "8080"
    secrets:
      - TINFOIL_API_KEY
      - AGENT_TOKEN

shim:
  upstream-port: 8080
  paths:
    - /health
    - /chat
    - /
