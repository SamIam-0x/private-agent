# Digest on main is a placeholder. The release workflow rewrites it on the tag.
# https://docs.tinfoil.sh/containers/building-images

cvm-version: "0.14.12"
cpus: 2
memory: 4096

networks:
  public:
    egress: open

containers:
  - name: agent
    image: "ghcr.io/samiam-0x/private-agent@sha256:17de405d81f7bcff8acf68c9b0b2b92a93a3e438e2ae9bb6c66cfb07e8781fd5" # v0.0.1
    networks: [public]
    env:
      - MODEL: "kimi-k3"
      - PORT: "8080"
    secrets:
      - TINFOIL_API_KEY
      - AGENT_TOKEN

shim:
  upstream-port: 8080
  paths:
    - /health
    - /chat
    - /
