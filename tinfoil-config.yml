# Digest on main is a placeholder. The release workflow rewrites it on the tag.
# https://docs.tinfoil.sh/containers/building-images

cvm-version: "0.14.12"
cpus: 1
memory: 2048

networks:
  public:
    egress: open

containers:
  - name: agent
    image: "ghcr.io/samiam-0x/private-agent@sha256:b35037e5bf965f878cf10b066f6db3a8f4afe068883f04155ee7e46dccf2f07a" # v0.0.5
    networks: [public]
    env:
      - MODEL: "kimi-k3"
      - PORT: "8080"
      # The root filesystem is read-only. The Tinfoil SDK and sigstore write
      # small cache files under HOME and XDG dirs, so send those to /tmp.
      - HOME: "/tmp/home"
      - XDG_CACHE_HOME: "/tmp/cache"
      - XDG_DATA_HOME: "/tmp/data"
    tmpfs:
      /tmp: "size=64m"
    secrets:
      - TINFOIL_API_KEY
      - AGENT_TOKEN

shim:
  upstream-port: 8080
  paths:
    - /health
    - /chat
    - /
