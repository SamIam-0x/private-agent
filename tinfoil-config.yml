# Digest on main is a placeholder. The release workflow rewrites it on the tag.
# https://docs.tinfoil.sh/containers/building-images

cvm-version: "0.14.12"
cpus: 2
memory: 4096

networks:
  public:
    egress: open

containers:
  - name: agent
    image: "ghcr.io/samiam-0x/private-agent@sha256:6e29eb2dbbe6d0e60ee2ea1b1401dca73120a00857a91c1c915315d384782f50" # v0.0.3
    networks: [public]
    env:
      - MODEL: "kimi-k3"
      - PORT: "8080"
    secrets:
      - TINFOIL_API_KEY
      - AGENT_TOKEN

shim:
  upstream-port: 8080
  paths:
    - /health
    - /chat
    - /
